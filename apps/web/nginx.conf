server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos básicos de segurança (a API aplica os dela via Helmet). Os `location` abaixo não usam add_header:
  # quando usam, o nginx descarta estes.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # A API fica no mesmo domínio: o navegador não precisa de CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # O service worker do app de campo precisa ser revalidado a cada visita para as atualizações chegarem.
  location = /sw.js {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html (inclusive a página pública /p/:token).
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
